<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">
                ✔ Todo Application
            </h1>
            <p class="subtitle">Keep Track Of Your Daily Tasks</p>
        </div>
        
        <div class="input-container">
            <input id="task-input" type="text" placeholder="Enter Your Tasks Here..." class="input-field">
            <button id="add-button" class="add-button">Add Task</button>
        </div>
        <h3 class="task-name">📋 Your Tasks</h3>
        <div id="task-list" class="task-list">

        </div>

   <div class="filter-btn">
    <button id="filter-all" class="filter-button">All</button>
    <button id="filter-completed" class="filter-button">Completed</button>
    <button id="filter-pending" class="filter-button">Pending</button>
   </div>
  
    </div>

    
    <script src="script.js"></script>
</body>
</html>
